<!doctype html>

    font-weight:700;
    font-size:112px;
    line-height:1.02;
    letter-spacing:0.02em;
    color:#FBF3E7;
    text-transform:uppercase;
    text-shadow:0 6px 22px rgba(0,0,0,0.6);
