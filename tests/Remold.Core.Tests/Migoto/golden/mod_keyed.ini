; Pooled mesh swap - generated by the Remold pooled mesh-swap emitter
; one pipeline per replacement: capture each pool part's posed vb0 + vs-cb1 -> recover
; into that pipeline's union palette (rows in each owner part's draw space) -> CONVERT
; all rows into the anchor's space at the anchor draw -> skin the new geometry once ->
; draw at the anchor (in EVERY pass the anchor fires in; texture binds probe the
; slots actually bound at the draw, via filter_index tags on the anchor's own stock
; maps) -> hide the other meshes. Meshes pooled by several
; pipelines are captured once; their capture section serves every pipeline.
; Compute (recover/convert/skin) runs ONCE per frame per chain ($zz_done_* flags,
; reset in [Present]); the draw runs at every pass fire.

[Constants]
global $zz_t = 0
global $zz_slot_a = 0
global $zz_slot_n = 0
global $zz_slot_r = 0
global $zz_done_swap = 0
global $zz_gate_src_alpha = 0
global $zz_seen_src_alpha = 0
global $zz_key_f6 = 0
global $zz_key_f8 = 0
global $zz_key_f9 = 0

[Present]
$zz_done_swap = 0
$zz_gate_src_alpha = $zz_seen_src_alpha
$zz_seen_src_alpha = 0

[Key_zz_key_f6]
key = no_modifiers F6
run = CommandListKey_zz_key_f6

[CommandListKey_zz_key_f6]
$zz_key_f6 = $zz_key_f6 + 1
if $zz_key_f6 == 2
$zz_key_f6 = 0
endif

[Key_zz_key_f8]
key = no_modifiers F8
run = CommandListKey_zz_key_f8

[CommandListKey_zz_key_f8]
$zz_key_f8 = $zz_key_f8 + 1
if $zz_key_f8 == 2
$zz_key_f8 = 0
endif

[Key_zz_key_f9]
key = no_modifiers F9
run = CommandListKey_zz_key_f9

[CommandListKey_zz_key_f9]
$zz_key_f9 = $zz_key_f9 + 1
if $zz_key_f9 == 2
$zz_key_f9 = 0
endif

[Resource_Palette_swap]
type = RWStructuredBuffer
stride = 16
filename = palette_seed_swap.buf
[Resource_PaletteConv_swap]
type = RWStructuredBuffer
stride = 16
filename = palette_seed_swap.buf
[Resource_OwnerPart_swap]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = owner_part_swap.buf
[Resource_alpha_Cpinv]
type = Buffer
format = DXGI_FORMAT_R32_FLOAT
filename = alpha_cpinv.buf
[Resource_alpha_Sel]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = alpha_sel.buf
[Resource_alpha_Off]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = alpha_off.buf
[Resource_alpha_Posed]

[Resource_alpha_CB]

[Resource_alpha_Map_swap]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = alpha_map_swap.buf
[Resource_beta_Cpinv]
type = Buffer
format = DXGI_FORMAT_R32_FLOAT
filename = beta_cpinv.buf
[Resource_beta_Sel]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_sel.buf
[Resource_beta_Off]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_off.buf
[Resource_beta_Posed]

[Resource_beta_CB]

[Resource_beta_Map_swap]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_map_swap.buf
[Resource_NewBind_swap]
type = RWBuffer
stride = 40
filename = combined_bind_swap.buf
[Resource_NewSkin_swap]
type = RWBuffer
stride = 32
filename = combined_skin_swap.buf
[Resource_NewVB1_swap]
type = RWBuffer
stride = 20
filename = combined_vb1_swap.buf
[Resource_NewIB_swap]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = combined_ib_swap.buf
[Resource_NewPosed_swap]
type = Buffer
stride = 40
bind_flags = vertex_buffer
filename = combined_bind_swap.buf
[Resource_NewPosedUAV_swap]
type = RWByteAddressBuffer
stride = 0
bind_flags = unordered_access
filename = combined_bind_swap.buf
[Resource_SaveVB0]

[Resource_SaveVB1]

[Resource_SaveVB3]

[Resource_SaveIB]


[TextureOverride_Cap_alpha]
hash = aaaa1111
match_priority = 0
Resource_alpha_Posed = ref vb0
Resource_alpha_CB = copy vs-cb1
$zz_seen_src_alpha = 1
if $zz_key_f6 == 0
if $zz_key_f8 == 0
handling = skip
endif
endif

[TextureOverride_Cap_beta]
hash = bbbb2222
match_priority = 0
Resource_beta_Posed = ref vb0
Resource_beta_CB = copy vs-cb1
if $zz_key_f6 == 0
if $zz_key_f8 == 0
handling = skip
endif
endif
if $zz_key_f6 == 0
if $zz_key_f8 == 0
if $zz_done_swap == 0
if $zz_gate_src_alpha == 1
run = CustomShaderRecover_alpha_swap
endif
run = CustomShaderRecover_beta_swap
run = CustomShaderConvert_swap
if $zz_gate_src_alpha == 0
run = CustomShaderTie_alpha_swap
endif
run = CustomShaderSkin_swap
$zz_done_swap = 1
endif
run = CommandListDraw_swap
endif
endif

[TextureOverride_Hide_0]
hash = cccc3333
match_priority = 0
if $zz_key_f6 == 0
handling = skip
endif

[TextureOverride_Hide_1]
hash = dddd4444
match_priority = 0
if $zz_key_f6 == 0
if $zz_key_f9 == 0
handling = skip
endif
endif

[CustomShaderRecover_alpha_swap]
cs = recover_alpha_cs.hlsl
cs-u1 = copy Resource_Palette_swap
cs-t0 = copy Resource_alpha_Posed
cs-t1 = Resource_alpha_Cpinv
cs-t2 = Resource_alpha_Map_swap
cs-t3 = Resource_alpha_Sel
cs-t4 = Resource_alpha_Off
Dispatch = 1, 1, 1
Resource_Palette_swap = copy cs-u1
post cs-u1 = null

[CustomShaderRecover_beta_swap]
cs = recover_beta_cs.hlsl
cs-u1 = copy Resource_Palette_swap
cs-t0 = copy Resource_beta_Posed
cs-t1 = Resource_beta_Cpinv
cs-t2 = Resource_beta_Map_swap
cs-t3 = Resource_beta_Sel
cs-t4 = Resource_beta_Off
Dispatch = 1, 1, 1
Resource_Palette_swap = copy cs-u1
post cs-u1 = null

[CustomShaderConvert_swap]
cs = convert_cs_swap.hlsl
cs-u1 = copy Resource_PaletteConv_swap
cs-t0 = copy Resource_Palette_swap
cs-t1 = Resource_OwnerPart_swap
cs-cb5 = Resource_alpha_CB
cs-cb6 = Resource_beta_CB
cs-cb13 = Resource_beta_CB
Dispatch = 1, 1, 1
Resource_PaletteConv_swap = copy cs-u1
post cs-u1 = null

[CustomShaderTie_alpha_swap]
cs = tiefill_alpha_swap.hlsl
cs-t0 = copy Resource_PaletteConv_swap
cs-u1 = copy Resource_PaletteConv_swap
Dispatch = 1, 1, 1
Resource_PaletteConv_swap = copy cs-u1
post cs-u1 = null

[CustomShaderSkin_swap]
cs = skin_cs_swap.hlsl
cs-u1 = Resource_NewPosedUAV_swap
cs-t0 = copy Resource_NewBind_swap
cs-t1 = copy Resource_NewSkin_swap
cs-t2 = copy Resource_PaletteConv_swap
Dispatch = 1, 1, 1
cs-u1 = null
Resource_NewPosed_swap = copy Resource_NewPosedUAV_swap
post cs-u1 = null

[CommandListDraw_swap]
Resource_SaveVB0 = ref vb0
Resource_SaveVB1 = ref vb1
Resource_SaveVB3 = ref vb3
Resource_SaveIB = ref ib
vb0 = Resource_NewPosed_swap
vb1 = Resource_NewVB1_swap
vb3 = Resource_NewPosed_swap
ib = Resource_NewIB_swap
drawindexed = 9, 0, 0
drawindexed = 9, 9, 0
vb0 = Resource_SaveVB0
vb1 = Resource_SaveVB1
vb3 = Resource_SaveVB3
ib = Resource_SaveIB
