; Pooled mesh swap - generated by the Remold pooled mesh-swap emitter
; one pipeline per replacement: capture each pool part's posed vb0 + vs-cb1 -> recover
; into that pipeline's union palette (rows in each owner part's draw space) -> CONVERT
; all rows into the anchor's space at the anchor draw -> skin the new geometry once ->
; draw at the anchor (in EVERY pass the anchor fires in; texture binds probe the
; slots actually bound at the draw, via filter_index tags on the anchor's own stock
; maps) -> hide the other meshes. Meshes pooled by several
; pipelines are captured once; their capture section serves every pipeline.
; Compute (recover/convert/skin) runs ONCE per frame per chain ($zz_done_* flags,
; reset in [Present]); the draw runs at every pass fire.

