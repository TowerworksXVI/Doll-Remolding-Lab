global $zz_t = 0
global $zz_slot_a = 0
global $zz_slot_n = 0
global $zz_slot_r = 0
global $zz_done_swap = 0
global $zz_gate_src_alpha = 0
global $zz_seen_src_alpha = 0

[Present]
