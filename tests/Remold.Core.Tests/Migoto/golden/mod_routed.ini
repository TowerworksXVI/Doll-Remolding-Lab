filename = alpha_sel.buf
[Resource_alpha_Off]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = alpha_off.buf
[Resource_alpha_Posed]

[Resource_alpha_CB]

[Resource_alpha_Map_swap]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = alpha_map_swap.buf
[Resource_beta_Cpinv]
type = Buffer
format = DXGI_FORMAT_R32_FLOAT
filename = beta_cpinv.buf
[Resource_beta_Sel]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_sel.buf
[Resource_beta_Off]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_off.buf
[Resource_beta_Posed]

[Resource_beta_CB]

[Resource_beta_Map_swap]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_map_swap.buf
[Resource_beta_lod1_Cpinv]
type = Buffer
format = DXGI_FORMAT_R32_FLOAT
filename = beta_lod1_cpinv.buf
[Resource_beta_lod1_Sel]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_lod1_sel.buf
[Resource_beta_lod1_Off]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_lod1_off.buf
[Resource_beta_lod1_Posed]

[Resource_beta_lod1_Map_swap]
type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = beta_lod1_map_swap.buf
[Resource_NewBind_swap]
type = RWBuffer
stride = 40
filename = combined_bind_swap.buf
[Resource_NewSkin_swap]
type = RWBuffer
stride = 32
filename = combined_skin_swap.buf
[Resource_NewVB1_swap]
type = RWBuffer
stride = 20
filename = combined_vb1_swap.buf
[Resource_NewIB_swap]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = combined_ib_swap.buf
[Resource_NewPosed_swap]
type = Buffer
stride = 40
bind_flags = vertex_buffer
filename = combined_bind_swap.buf
[Resource_NewPosedUAV_swap]
type = RWByteAddressBuffer
stride = 0
bind_flags = unordered_access
filename = combined_bind_swap.buf
[Resource_SaveVB0]

[Resource_SaveVB1]

[Resource_SaveVB3]

[Resource_SaveIB]


[TextureOverride_Cap_alpha]
hash = aaaa1111
match_priority = 0
Resource_alpha_Posed = ref vb0
Resource_alpha_CB = copy vs-cb1
$zz_seen_src_alpha = 1
handling = skip

[TextureOverride_Cap_beta]
hash = bbbb2222
match_priority = 0
Resource_beta_Posed = ref vb0
Resource_beta_CB = copy vs-cb1
handling = skip
if $zz_done_swap == 0
if $zz_gate_src_alpha == 1
run = CustomShaderRecover_alpha_swap
endif
run = CustomShaderRecover_beta_swap
run = CustomShaderConvert_swap
if $zz_gate_src_alpha == 0
run = CustomShaderTie_alpha_swap
endif
run = CustomShaderSkin_swap
$zz_done_swap = 1
endif

[TextureOverride_Cap_beta_DrawS0]
hash = bbbb2222
match_priority = 0
match_first_index = 0
match_index_count = 60
run = CommandListDrawS0_swap

[TextureOverride_Cap_beta_DrawS1]
hash = bbbb2222
match_priority = 0
match_first_index = 60
match_index_count = 84
run = CommandListDrawS1_swap
run = CommandListDrawS2_swap
run = CommandListDrawS3_swap

[TextureOverride_Cap_beta_DrawFull]
hash = bbbb2222
match_priority = 0
match_first_index = 0
match_index_count = 144
run = CommandListDraw_swap

[TextureOverride_Cap_beta_lod1]
hash = bbbb2223
match_priority = 0
Resource_beta_lod1_Posed = ref vb0
handling = skip
if $zz_done_swap_lod1 == 0
if $zz_gate_src_alpha == 1
run = CustomShaderRecover_alpha_swap
endif
run = CustomShaderRecover_beta_lod1_swap
run = CustomShaderConvertW_swap
if $zz_gate_src_alpha == 0
run = CustomShaderTie_alpha_swap
endif
run = CustomShaderSkin_swap
$zz_done_swap_lod1 = 1
endif

[TextureOverride_Cap_beta_lod1_DrawS0]
